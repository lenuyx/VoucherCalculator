<!DOCTYPE html>
<html lang="de">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voucher Rechner</title>
<style>
body {
font-family: sans-serif;
margin: 0;
padding: 20px;
background: #f5f5f5;
}
.box {
background: white;
padding: 20px;
border-radius: 12px;
box-shadow: 0 0 10px rgba(0,0,0,0.1);
max-width: 450px;
margin: auto;
}
input {
width: 100%;
padding: 12px;
margin-top: 10px;
border-radius: 8px;
border: 1px solid #ccc;
font-size: 18px;
}
button {
width: 100%;
padding: 14px;
margin-top: 20px;
background: #0078ff;
color: white;
border: none;
border-radius: 8px;
font-size: 20px;
}
.case {
background: white;
padding: 12px;
margin-top: 12px;
border-radius: 8px;
border: 1px solid #ddd;
font-size: 16px;
}
</style>
</head>
<body>

<div class="box">
<h2>Voucher Restaurant Rechner</h2>

<label>Voucher Wert (€):</label>
<input id="voucherValue" type="number" step="0.01">

<label>Rechnung (€):</label>
<input id="bill" type="number" step="0.01">

<button onclick="calculate()">Berechnen</button>

<div id="results"></div>
</div>

<script>
const voucherInput = document.getElementById("voucherValue");
voucherInput.value = localStorage.getItem("voucherValue") || "7.67";

function roundEuro(value) {
return Math.ceil(value);
}

function calculate() {
const voucher = parseFloat(voucherInput.value);
const bill = parseFloat(document.getElementById("bill").value);

localStorage.setItem("voucherValue", voucher);

const results = document.getElementById("results");
results.innerHTML = "";

if (isNaN(voucher) || isNaN(bill) || voucher <= 0 || bill <= 0) {
results.innerHTML = "<div class=\"case\">Bitte gültige Werte eingeben.</div>";
return;
}

// Fall 1: Minimumzahlung
const vouchersMin = Math.floor(bill / voucher);
const voucherSumMin = vouchersMin * voucher;
const restMinRaw = bill - voucherSumMin;
const restMin = roundEuro(restMinRaw);
const tipMin = restMin - restMinRaw;
const tipMinPercent = (tipMin / bill * 100).toFixed(1);

const case1 = <div class="case"> <strong>Fall 1 – Minimumzahlung</strong><br> ${vouchersMin} Voucher + ${restMin} €<br> Trinkgeld: ${tipMin.toFixed(2)} € (${tipMinPercent}%) </div>;
results.innerHTML += case1;

// Fall 2: ca. 10% Trinkgeld
const targetTip = bill * 0.10;
const targetEnd = roundEuro(bill + targetTip);

const vouchers10 = Math.floor(targetEnd / voucher);
const voucherSum10 = vouchers10 * voucher;
const rest10 = roundEuro(targetEnd - voucherSum10);
const tip10 = targetEnd - bill;
const tip10Percent = (tip10 / bill * 100).toFixed(1);

const case2 = <div class="case"> <strong>Fall 2 – ca. 10% Trinkgeld</strong><br> ${vouchers10} Voucher + ${rest10} €<br> Trinkgeld: ${tip10.toFixed(2)} € (${tip10Percent}%) </div>;
results.innerHTML += case2;

// Fall 3: Überzahlung mit Voucher
const vouchersOver = vouchersMin + 1;
const voucherSumOver = vouchersOver * voucher;
const tipOver = voucherSumOver - bill;
const tipOverPercent = (tipOver / bill * 100).toFixed(1);

const case3 = <div class="case"> <strong>Fall 3 – Überzahlung mit Voucher</strong><br> ${vouchersOver} Voucher<br> Trinkgeld: ${tipOver.toFixed(2)} € (${tipOverPercent}%) </div>;
results.innerHTML += case3;
}
</script>

</body>
</html>
