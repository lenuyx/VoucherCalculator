<!DOCTYPE html>
<html lang="de">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>voucher Rechner</title>
<style>
body {
font-family: sans-serif;
margin: 0;
padding: 20px;
background: #f5f5f5;
}
.box {
background: white;
padding: 20px;
border-radius: 12px;
box-shadow: 0 0 10px rgba(0,0,0,0.1);
max-width: 400px;
margin: auto;
}
input {
width: 100%;
padding: 12px;
margin-top: 10px;
border-radius: 8px;
border: 1px solid #ccc;
font-size: 18px;
}
.tip-buttons button {
width: 30%;
padding: 10px;
margin: 5px 1%;
background: #444;
color: white;
border: none;
border-radius: 8px;
font-size: 16px;
}
button.calculate {
width: 100%;
padding: 14px;
margin-top: 20px;
background: #0078ff;
color: white;
border: none;
border-radius: 8px;
font-size: 20px;
}
#result {
margin-top: 20px;
font-size: 18px;
background: #eef;
padding: 15px;
border-radius: 8px;
}
</style>
</head>
<body>

<div class="box">
<h2>Restaurantgutschein Rechner</h2>

<label>Wert (€):</label>
<input id="voucherValue" type="number" step="0.01">

<label>Rechnung (€):</label>
<input id="bill" type="number" step="0.01">

<div class="tip-buttons">
<button onclick="setTip(0.05)">+5%</button>
<button onclick="setTip(0.10)">+10%</button>
<button onclick="setTip(0.15)">+15%</button>
</div>

<button class="calculate" onclick="calculate()">Berechnen</button>

<div id="result"></div>
</div>

<script>
let tipPercent = 0;

const voucherInput = document.getElementById("voucherValue");
voucherInput.value = localStorage.getItem("voucherValue") || "7.67";

function setTip(percent) {
tipPercent = percent;
}

function calculate() {
const voucherValue = parseFloat(voucherInput.value);
const bill = parseFloat(document.getElementById("bill").value);

localStorage.setItem("voucherValue", voucherValue);

const tip = bill * tipPercent;
const total = bill + tip;

const vouchersNeeded = Math.floor(total / voucherValue);
const rest = (total - vouchersNeeded * voucherValue).toFixed(2);

document.getElementById("result").innerHTML =
"Ergebnis:<br>" +
"Rechnung: " + bill.toFixed(2) + " €<br>" +
"Trinkgeld: " + tip.toFixed(2) + " €<br>" +
"Gesamt: " + total.toFixed(2) + " €<br>" +
"vouchers einsetzbar: " + vouchersNeeded + "<br>" +
"Restbetrag: " + rest + " €";
}
</script>

</body>
</html>
