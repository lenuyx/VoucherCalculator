<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voucher Calculator</title>
<style>
    body {
        font-family: sans-serif;
        margin: 0;
        padding: 16px;
        background: #f5f5f5;
    }
    .box {
        background: white;
        padding: 18px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        max-width: 420px;
        margin: auto;
    }
    h2 {
        margin-top: 0;
        font-size: 22px;
    }
    label {
        display: block;
        margin-top: 12px;
        font-size: 15px;
    }
    input {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 20px;
        box-sizing: border-box;
    }
    button {
        width: 100%;
        padding: 14px;
        margin-top: 18px;
        background: #0078ff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 20px;
    }
    #results {
        margin-top: 18px;
    }
    .case {
        background: #ffffff;
        padding: 12px;
        margin-top: 12px;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-size: 16px;
    }
    .case strong {
        display: block;
        margin-bottom: 6px;
        font-size: 17px;
    }
</style>
</head>
<body>

<div class="box">
    <h2>Voucher Restaurant Calculator</h2>

    <label>Voucher Value (€):</label>
    <input id="voucherValue" type="text" inputmode="decimal">

    <label>Bill (€):</label>
    <input id="bill" type="text" inputmode="decimal">

    <button onclick="calculate()">Calculate</button>

    <div id="results"></div>
</div>

<script>
    const voucherInput = document.getElementById("voucherValue");
    const storedVoucher = localStorage.getItem("voucherValue");
    voucherInput.value = storedVoucher ? storedVoucher : "7.67";

    function toNumber(value) {
        if (!value) return NaN;
        return parseFloat(String(value).replace(",", "."));
    }

    function roundUpEuro(value) {
        return Math.ceil(value);
    }

    function calculate() {
        const voucher = toNumber(document.getElementById("voucherValue").value);
        const bill = toNumber(document.getElementById("bill").value);

        const results = document.getElementById("results");
        results.innerHTML = "";

        if (isNaN(voucher) || isNaN(bill) || voucher <= 0 || bill <= 0) {
            results.innerHTML = "<div class='case'>Please enter valid numbers.</div>";
            return;
        }

        localStorage.setItem("voucherValue", voucher);

        // === FALL 1: Minimum Payment ===
        const vouchersMin = Math.floor(bill / voucher);
        const voucherSumMin = vouchersMin * voucher;
        const restMinRaw = bill - voucherSumMin;
        const restMin = roundUpEuro(restMinRaw);
        const tipMin = restMin - restMinRaw;
        const tipMinPercent = (tipMin / bill * 100).toFixed(1);

        let case1 = "<div class='case'>";
        case1 += "<strong>Case 1 – Minimum Payment</strong>";
        case1 += "Voucher count: " + vouchersMin + "<br>";
        case1 += "Voucher total: €" + voucherSumMin.toFixed(2) + "<br>";
        case1 += "Cash to pay: €" + restMin.toFixed(0) + "<br>";
        case1 += "Tip: €" + tipMin.toFixed(2) + " (" + tipMinPercent + "%)";
        case1 += "</div>";
        results.innerHTML += case1;

        // === FALL 2: ~10% Tip ===
        const targetTip = bill * 0.10;
        const targetEnd = roundUpEuro(bill + targetTip);
        const rest10Raw = targetEnd - voucherSumMin;
        const rest10 = roundUpEuro(rest10Raw < 0 ? 0 : rest10Raw);
        const tip10 = targetEnd - bill;
        const tip10Percent = (tip10 / bill * 100).toFixed(1);

        let case2 = "<div class='case'>";
        case2 += "<strong>Case 2 – ~10% Tip</strong>";
        case2 += "Voucher count: " + vouchersMin + "<br>";
        case2 += "Voucher total: €" + voucherSumMin.toFixed(2) + "<br>";
        case2 += "Cash to pay: €" + rest10.toFixed(0) + "<br>";
        case2 += "Tip: €" + tip10.toFixed(2) + " (" + tip10Percent + "%)";
        case2 += "</div>";
        results.innerHTML += case2;

        // === FALL 3: Overpay with Voucher ===
        const vouchersOver = vouchersMin + 1;
        const voucherSumOver = vouchersOver * voucher;
        const tipOver = voucherSumOver - bill;
        const tipOverPercent = (tipOver / bill * 100).toFixed(1);

        let case3 = "<div class='case'>";
        case3 += "<strong>Case 3 – Overpay with Voucher</strong>";
        case3 += "Voucher count: " + vouchersOver + "<br>";
        case3 += "Voucher total: €" + voucherSumOver.toFixed(2) + "<br>";
        case3 += "Cash to pay: €0<br>";
        case3 += "Tip: €" + tipOver.toFixed(2) + " (" + tipOverPercent + "%)";
        case3 += "</div>";
        results.innerHTML += case3;
    }
</script>

</body>
</html>
