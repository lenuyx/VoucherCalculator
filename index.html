
<DOCTYPE html>
<html lang="de">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pluxee Rechner</title>
<style>
    body {
        font-family: sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f5f5;
    }
    .box {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        max-width: 400px;
        margin: auto;
    }
    input {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 18px;
    }
    button {
        width: 100%;
        padding: 14px;
        margin-top: 20px;
        background: #0078ff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 20px;
    }
    #result {
        margin-top: 20px;
        font-size: 18px;
        background: #eef;
        padding: 15px;
        border-radius: 8px;
    }
</style>
</head>
<body>

<div class="box">
    <h2>Pluxee Restaurantgutschein Rechner</h2>

    <label>Pluxee Wert (€):</label>
    <input id="pluxeeValue" type="number" step="0.01">

    <label>Rechnung (€):</label>
    <input id="bill" type="number" step="0.01">

    <label>Trinkgeld (€) – optional:</label>
    <input id="tip" type="number" step="0.01" placeholder="0.00">

    <button onclick="calculate()">Berechnen</button>

    <div id="result"></div>
</div>

<script>
    // Pluxee-Wert aus LocalStorage laden
    const pluxeeInput = document.getElementById("pluxeeValue");
    pluxeeInput.value = localStorage.getItem("pluxeeValue") || "7.67";

    function calculate() {
        const pluxeeValue = parseFloat(pluxeeInput.value);
        const bill = parseFloat(document.getElementById("bill").value);
        const tip = parseFloat(document.getElementById("tip").value) || 0;

        // Pluxee-Wert speichern
        localStorage.setItem("pluxeeValue", pluxeeValue);

        const total = bill + tip;

        // Anzahl Pluxees
        const pluxeesNeeded = Math.floor(total / pluxeeValue);

        // Restbetrag
        const rest = (total - pluxeesNeeded * pluxeeValue).toFixed(2);

        document.getElementById("result").innerHTML = `
            <strong>Ergebnis:</strong><br>
            Gesamtbetrag: ${total.toFixed(2)} €<br>
            Pluxees einsetzbar: ${pluxeesNeeded}<br>
            Restbetrag: ${rest} €
        `;
    }
</script>

</body>
</html>
